<ion-header style="    box-shadow: none;">
  <ion-toolbar class="header-toolbar">
    <img src="assets/img/logo.png" alt="Logo" class="app-logo" style="    margin-top: 30px;"/>
  </ion-toolbar>
</ion-header>

<ion-content padding>
  <!-- <p>Is listening ? : {{ isListening }}</p> -->
  <!-- <button ion-button (click)="getPermission()">Get Permission</button> -->

  <div class="text-container">
    <!-- <h1>Welcome to ARTHA SETU</h1> -->
    <p style="    margin-top: 0px;
    font-size: 18px;
    font-weight: bold;
    color: #5f1ca7;
    padding: 0px 65px;">Banking for Every Voice. Banking for Everyone.</p>
  </div>


   <button class="btn-button" (click)="goToBanking()" style="height: 80px;">
      Go to Banking <img src="assets/img/banking.png" style="    width: 50px;
    vertical-align: middle;">
    </button>

  <button ion-button (click)="listen()" class="speaking" [class.pulsing]="isListening" style="margin-top: 50px;">
    <svg fill="#664bac" height="109px" width="109px" version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:xlink="http://www.w3.org/1999/xlink" enable-background="new 0 0 512 512"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g> <g> <path d="m439.5,236c0-11.3-9.1-20.4-20.4-20.4s-20.4,9.1-20.4,20.4c0,70-64,126.9-142.7,126.9-78.7,0-142.7-56.9-142.7-126.9 0-11.3-9.1-20.4-20.4-20.4s-20.4,9.1-20.4,20.4c0,86.2 71.5,157.4 163.1,166.7v57.5h-23.6c-11.3,0-20.4,9.1-20.4,20.4 0,11.3 9.1,20.4 20.4,20.4h88c11.3,0 20.4-9.1 20.4-20.4 0-11.3-9.1-20.4-20.4-20.4h-23.6v-57.5c91.6-9.3 163.1-80.5 163.1-166.7z"></path> <path d="m256,323.5c51,0 92.3-41.3 92.3-92.3v-127.9c0-51-41.3-92.3-92.3-92.3s-92.3,41.3-92.3,92.3v127.9c0,51 41.3,92.3 92.3,92.3zm-52.3-220.2c0-28.8 23.5-52.3 52.3-52.3s52.3,23.5 52.3,52.3v127.9c0,28.8-23.5,52.3-52.3,52.3s-52.3-23.5-52.3-52.3v-127.9z"></path> </g> </g> </g></svg>
  </button>
  <ion-card>
    <ion-card-content *ngFor="let match of matches">
      <div *ngIf="spokenText()" class="spoken-text">{{spokenText()}}</div>
      <div *ngIf="speechResponse()" class="api-response">{{speechResponse()}}</div>
    </ion-card-content>
  </ion-card>


</ion-content>
